<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vitro</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon48.png" alt="" width="32" height="32" />
      <div>
        <h1>Vitro</h1>
        <p>YouTube em vidro · <span id="version"></span></p>
      </div>
      <button class="switch" data-key="enabled" role="switch" aria-label="Ativar Vitro"></button>
    </header>

    <button id="edit" class="primary">Personalizar aparência…</button>

    <section>
      <h2>Limpeza</h2>
      <label>Esconder Shorts <button class="switch" data-key="hideShorts" role="switch"></button></label>
      <label>Bloquear anúncios <button class="switch" data-key="blockAds" role="switch"></button></label>
      <label>Esconder recomendados no vídeo <button class="switch" data-key="hideRelated" role="switch"></button></label>
      <label>Esconder telas finais <button class="switch" data-key="hideEndscreens" role="switch"></button></label>
      <label>Esconder produtos/merch <button class="switch" data-key="hideMerch" role="switch"></button></label>
    </section>

    <section>
      <h2>Aparência</h2>
      <label>Saudação na home <button class="switch" data-key="hero" role="switch"></button></label>
      <label>Cartões de vidro <button class="switch" data-key="cards" role="switch"></button></label>
      <label>Luz do cursor <button class="switch" data-key="light" role="switch"></button></label>
      <label>Sala de cinema no vídeo <button class="switch" data-key="room" role="switch"></button></label>
    </section>

    <footer><button id="reset" class="link">Restaurar padrões</button></footer>

    <script src="../src/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
